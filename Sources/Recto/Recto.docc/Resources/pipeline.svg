<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .node { fill: #f5f5f7; stroke: #555; stroke-width: 1.25; rx: 8; ry: 8; }
      .label { fill: #1d1d1f; }
      .edge { stroke: #555; stroke-width: 1.25; fill: none; }
      .edge-label { fill: #555; font-size: 11px; font-style: italic; }
      @media (prefers-color-scheme: dark) {
        .node { fill: #1d1d1f; stroke: #c7c7cc; }
        .label { fill: #f5f5f7; }
        .edge { stroke: #c7c7cc; }
        .edge-label { fill: #c7c7cc; }
        marker path { fill: #c7c7cc; }
      }
    </style>
  </defs>

  <rect class="node" x="100" y="10"  width="160" height="44"/>
  <text class="label" x="180" y="37" text-anchor="middle">AVAudioPCMBuffer</text>

  <path class="edge" d="M180,54 L180,110" marker-end="url(#arrow)"/>
  <text class="edge-label" x="188" y="86">AudioBufferConverter</text>

  <rect class="node" x="100" y="116" width="160" height="44"/>
  <text class="label" x="180" y="143" text-anchor="middle">CMSampleBuffer</text>

  <path class="edge" d="M180,160 L180,216" marker-end="url(#arrow)"/>

  <rect class="node" x="100" y="222" width="160" height="44"/>
  <text class="label" x="180" y="249" text-anchor="middle">SpeechService</text>

  <path class="edge" d="M180,266 L180,344" marker-end="url(#arrow)"/>
  <text class="edge-label" x="188" y="298">transcripts:</text>
  <text class="edge-label" x="188" y="314">AsyncStream&lt;String&gt;</text>

  <rect class="node" x="100" y="350" width="160" height="44"/>
  <text class="label" x="180" y="377" text-anchor="middle">ScriptTracker</text>

  <path class="edge" d="M180,394 L180,456" marker-end="url(#arrow)"/>
  <text class="edge-label" x="188" y="430">currentWordIndex</text>

  <rect class="node" x="100" y="462" width="160" height="44"/>
  <text class="label" x="180" y="489" text-anchor="middle">UI (SwiftUI / AppKit)</text>
</svg>
